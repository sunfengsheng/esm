name: Windows build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MinGW Release, tests, and package
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check documentation updates
        shell: pwsh
        env:
          ESM_DOC_PR_BASE: ${{ github.event.pull_request.base.sha }}
          ESM_DOC_PUSH_BASE: ${{ github.event.before }}
          ESM_DOC_HEAD: ${{ github.sha }}
        run: |
          $base = $env:ESM_DOC_PR_BASE
          if ([string]::IsNullOrWhiteSpace($base)) { $base = $env:ESM_DOC_PUSH_BASE }
          .\tools\check-docs-updated.ps1 -BaseRef $base -HeadRef $env:ESM_DOC_HEAD

      - name: Install UCRT64 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-zlib
            make
            diffutils
            gawk
            grep
            sed
            perl

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress --limit-output

      - name: Configure Release build
        shell: msys2 {0}
        run: >-
          cmake -S . -B build-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DESM_BUILD_TESTS=ON
          -DESM_BUILD_BENCHMARKS=OFF
          -DESM_BUILD_CONTENT_SEARCH=ON
          -DESM_XAPIAN_PROVIDER=BUNDLED
          -DESM_XAPIAN_BUILD_JOBS=4

      - name: Compile
        shell: msys2 {0}
        run: cmake --build build-ci --parallel 4

      - name: Run tests
        shell: msys2 {0}
        run: ctest --test-dir build-ci --output-on-failure

      - name: Run 100-round recovery process-kill stress
        shell: pwsh
        run: .\build-ci\esm_tests.exe --recovery-fault-stress 100

      - name: Verify content prototype is statically linked
        shell: msys2 {0}
        run: |
          if objdump -p build-ci/esm_content_service.exe | grep -Eqi 'DLL Name:.*xapian'; then
            echo 'esm_content_service.exe unexpectedly depends on a Xapian DLL' >&2
            exit 1
          fi

      - name: Prepare release signing certificate
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) {
            Write-Warning 'WINDOWS_SIGNING_CERTIFICATE_BASE64 is not configured; publishing an unsigned prerelease package.'
            "ESM_RELEASE_SIGNED=false" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $path = Join-Path $env:RUNNER_TEMP 'everything_sm-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "ESM_SIGN_CERTIFICATE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ESM_RELEASE_SIGNED=true" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build NSIS installer
        shell: pwsh
        env:
          ESM_REF_TYPE: ${{ github.ref_type }}
          ESM_REF_NAME: ${{ github.ref_name }}
          ESM_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $version = $null
          $arguments = @{
            BuildDirectory = 'build-ci'
            SkipBuild = $true
          }
          if ($env:ESM_REF_TYPE -eq 'tag') {
            if ($env:ESM_REF_NAME -notmatch '^v([0-9]+(?:\.[0-9]+){2,3})$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.0'
            }
            $version = $Matches[1]
            $arguments.Version = $version
            if ($env:ESM_RELEASE_SIGNED -eq 'true') {
              $arguments.RequireSignature = $true
            }
          }
          .\packaging\build-installer.ps1 @arguments
          if ($env:ESM_REF_TYPE -eq 'tag' -and $env:ESM_RELEASE_SIGNED -ne 'true') {
            @(
              'This is an unsigned prerelease build.'
              'Windows may display an Unknown publisher warning.'
              'Verify the adjacent SHA-256 file before installation.'
            ) | Set-Content -LiteralPath 'dist/UNSIGNED-PRERELEASE.txt' -Encoding utf8
          }

      - name: Remove signing certificate
        if: always() && github.ref_type == 'tag'
        shell: pwsh
        run: |
          if ($env:ESM_SIGN_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:ESM_SIGN_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:ESM_SIGN_CERTIFICATE_PATH -Force
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: everything_sm-windows-${{ github.run_number }}
          path: |
            dist/*.exe
            dist/*.sha256
            dist/UNSIGNED-PRERELEASE.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  msvc:
    name: MSVC Release and tests
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Configure MSVC Release build
        shell: pwsh
        run: >-
          cmake -S . -B build-msvc-ci -A x64
          -DESM_BUILD_TESTS=ON
          -DESM_BUILD_BENCHMARKS=OFF
          -DESM_BUILD_CONTENT_SEARCH=OFF

      - name: Compile
        shell: pwsh
        run: cmake --build build-msvc-ci --config Release --parallel 4

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build-msvc-ci -C Release --output-on-failure

      - name: Run recovery process-kill smoke
        shell: pwsh
        run: .\build-msvc-ci\Release\esm_tests.exe --recovery-fault-stress 20

  installer-smoke:
    name: Silent install, upgrade, health, and uninstall
    needs: build
    runs-on: windows-2025
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: everything_sm-windows-${{ github.run_number }}
          path: dist

      - name: Run elevated installer smoke test
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter 'everything_sm-*-setup.exe' -File | Select-Object -Single
          $installDirectory = Join-Path $env:RUNNER_TEMP 'everything_sm-ci'
          .\tools\windows-install-smoke.ps1 -InstallerPath $installer.FullName -InstallDirectory $installDirectory

  release:
    name: Publish tagged release
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' && needs.msvc.result == 'success'
    needs:
      - build
      - msvc
      - installer-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v8
        with:
          name: everything_sm-windows-${{ github.run_number }}
          path: dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_SMOKE_RESULT: ${{ needs.installer-smoke.result }}
        run: |
          release_flags=()
          release_title="everything_sm $GITHUB_REF_NAME"
          if [[ -f dist/UNSIGNED-PRERELEASE.txt ]]; then
            release_flags+=(--prerelease)
            release_title="$release_title (unsigned prerelease)"
            if [[ "$INSTALLER_SMOKE_RESULT" != "success" ]]; then
              printf '\nInstaller smoke workflow result: %s.\n' "$INSTALLER_SMOKE_RESULT" >> dist/UNSIGNED-PRERELEASE.txt
            fi
          elif [[ "$INSTALLER_SMOKE_RESULT" != "success" ]]; then
            echo "Signed production releases require a successful installer smoke job." >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${release_flags[@]}" --title "$release_title"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}" --title "$release_title"
          fi
